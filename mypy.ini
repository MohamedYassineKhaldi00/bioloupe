# ============================================================================
# MyPy Configuration - Strict Mode
# ============================================================================
# MyPy is a static type checker for Python that helps catch type-related bugs
# This configuration enforces strict type checking across the codebase

[mypy]
# Python version to target
python_version = 3.11

# ============================================================================
# Strict Mode Settings
# ============================================================================
# Disallow defining functions without type annotations
disallow_untyped_defs = True

# Disallow defining functions with incomplete type annotations
disallow_incomplete_defs = True

# Type-check the interior of functions without type annotations
check_untyped_defs = True

# Disallow subclassing values of type Any
disallow_subclassing_any = True

# Disallow untyped calls
disallow_untyped_calls = False  # Set to True for maximum strictness

# Disallow untyped decorators
disallow_untyped_decorators = False  # Set to True for maximum strictness

# ============================================================================
# None and Optional Handling
# ============================================================================
# Disable implicit Optional (e.g., def foo(x: int = None) requires Optional[int])
no_implicit_optional = True

# Enable strict Optional checking
strict_optional = True

# ============================================================================
# Warnings
# ============================================================================
# Warn about returning values of type Any
warn_return_any = True

# Warn about unused mypy configuration options
warn_unused_configs = True

# Warn about redundant casts
warn_redundant_casts = True

# Warn about unused '# type: ignore' comments
warn_unused_ignores = True

# Warn about missing return statements
warn_no_return = True

# Warn about unreachable code
warn_unreachable = True

# ============================================================================
# Import Behavior
# ============================================================================
# How to handle imports
follow_imports = normal

# Ignore missing imports for third-party libraries without stubs
ignore_missing_imports = True

# Allow namespace packages
namespace_packages = True

# ============================================================================
# Output and Error Reporting
# ============================================================================
# Show error codes in output
show_error_codes = True

# Show column numbers in errors
show_column_numbers = True

# Pretty print error messages
pretty = True

# Use color in error messages
color_output = True

# Show absolute paths in error messages
show_absolute_path = False

# ============================================================================
# Miscellaneous
# ============================================================================
# Allow Any as a return type in untyped functions
allow_untyped_globals = False

# Allow redefinition of variables
allow_redefinition = True

# Strict equality checks
strict_equality = True

# ============================================================================
# Per-Module Options
# ============================================================================
# Relax strict rules for test files
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
ignore_errors = False

# Ignore errors in migration files
[mypy-alembic.versions.*]
ignore_errors = True

# Third-party libraries without type stubs
[mypy-qdrant_client.*]
ignore_missing_imports = True

[mypy-aioboto3.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True

[mypy-bcrypt.*]
ignore_missing_imports = True
