version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bioloupe-app
    environment:
      DATABASE_URL: postgresql+asyncpg://bioloupe:bioloupe@postgres:5432/bioloupe
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      AWS_REGION: us-east-1
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - qdrant
      - minio
    networks:
      - bioloupe-network

  postgres:
    image: postgres:15
    container_name: bioloupe-postgres
    environment:
      POSTGRES_DB: bioloupe
      POSTGRES_USER: bioloupe
      POSTGRES_PASSWORD: bioloupe
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bioloupe-network

  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: bioloupe-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - bioloupe-network

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: bioloupe-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - bioloupe-network

  redis:
    image: redis:7.2-alpine
    container_name: bioloupe-redis
    ports:
      - "6379:6379"
    networks:
      - bioloupe-network

networks:
  bioloupe-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
