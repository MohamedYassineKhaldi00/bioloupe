name: Integration tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bioloupe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bioloupe_test" --health-interval=5s --health-timeout=5s --health-retries=12
      minio:
        image: minio/minio:latest
        args: ["server", "/data"]
        env:
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -fsS http://localhost:9000/minio/health/live || exit 1" --health-interval=5s --health-timeout=5s --health-retries=12
      qdrant:
        image: qdrant/qdrant:v1.2.0
        ports:
          - 6333:6333
        options: >-
          --health-cmd="curl -fsS http://localhost:6333/collections || exit 1" --health-interval=5s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=12

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bioloupe_test
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      QDRANT_URL: http://localhost:6333
      RUN_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4
      - name: Wait for services
        run: |
          echo "Waiting for services to be healthy..."
          sleep 10
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || true
      - name: Run integration tests
        run: |
          pytest -q
