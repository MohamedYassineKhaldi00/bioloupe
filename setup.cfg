# ============================================================================
# Setup Configuration
# ============================================================================
# This file provides additional configuration for various development tools
# that may not support pyproject.toml or prefer setup.cfg

[metadata]
name = bioloupe
description = Bioloupe - Biological Data Analysis Platform
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/MohamedYassineKhaldi00/bioloupe
author = Bioloupe Team
license = MIT
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3.11
    Framework :: FastAPI
    Topic :: Software Development :: Libraries :: Python Modules

[options]
packages = find:
python_requires = >=3.11
include_package_data = True
zip_safe = False

[options.packages.find]
where = src
exclude =
    tests*
    docs*
    build*
    dist*

# ============================================================================
# Aliases for common development tasks
# ============================================================================
[aliases]
test = pytest

# ============================================================================
# Wheel configuration
# ============================================================================
[bdist_wheel]
universal = 0

# ============================================================================
# Tool configurations (legacy support)
# ============================================================================
[tool:pytest]
# Pytest configuration is in pyproject.toml
# This section is kept for backwards compatibility
testpaths = tests
